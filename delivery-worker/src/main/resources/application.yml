server:
  port: 8082

spring:
  application:
    name: delivery-worker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/deliveries}
    username: ${DB_USERNAME:deliveries}
    password: ${DB_PASSWORD:deliveries}
  cloud:
    aws:
      # Credentials come from the default AWS chain (IRSA on EKS).
      # Locally, docker-compose points the SQS endpoint at LocalStack.
      region:
        static: ${AWS_REGION:ap-southeast-1}
      sqs:
        # Fail fast instead of auto-creating a queue that would have no dead-letter queue.
        queue-not-found-strategy: fail

delivery:
  email:
    concurrency: 10
  sms:
    concurrency: 5
  retry:
    # Must equal the redrive maxReceiveCount on the request queues (Terraform: max_receive_count).
    max-attempts: 4
    initial-backoff: 2s
    multiplier: 2.0
    max-backoff: 60s
  simulation:
    # Fraction of sends that fail transiently, to exercise retries and the DLQ. Keep 0 in tests.
    transient-failure-rate: ${SIMULATED_FAILURE_RATE:0.0}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
