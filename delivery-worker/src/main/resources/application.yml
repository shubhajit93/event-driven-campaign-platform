server:
  port: 8082

spring:
  application:
    name: delivery-worker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/deliveries}
    username: ${DB_USERNAME:deliveries}
    password: ${DB_PASSWORD:deliveries}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: delivery-worker
      auto-offset-reset: earliest
      max-poll-records: 50

delivery:
  email:
    concurrency: 3
  sms:
    concurrency: 2
  retry:
    max-retries: 4
    initial-interval: 500ms
    multiplier: 2.0
    max-interval: 10s
  simulation:
    # Fraction of sends that fail transiently, to exercise retries and the DLT. Keep 0 in tests.
    transient-failure-rate: ${SIMULATED_FAILURE_RATE:0.0}

app:
  kafka:
    partitions: 3
    replicas: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
