apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-worker
  namespace: campaigns
  labels: { app: delivery-worker }
spec:
  replicas: 2
  selector:
    matchLabels: { app: delivery-worker }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: delivery-worker }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8082"
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: delivery-worker
          image: ghcr.io/shubhajit93/delivery-worker:0.1.0
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef: { name: platform-config }
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres.campaigns.svc:5432/deliveries
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: db-credentials, key: deliveries-username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: db-credentials, key: deliveries-password } }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 768Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8082 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8082 }
            initialDelaySeconds: 40
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: delivery-worker
  namespace: campaigns
spec:
  selector: { app: delivery-worker }
  ports:
    - port: 80
      targetPort: 8082
---
# Workers scale on CPU here. With KEDA, scaling on consumer lag is the better signal.
# Replicas beyond the topic's partition count would sit idle.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: delivery-worker
  namespace: campaigns
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: delivery-worker
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
