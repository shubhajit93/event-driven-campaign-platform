apiVersion: apps/v1
kind: Deployment
metadata:
  name: campaign-service
  namespace: campaigns
  labels: { app: campaign-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: campaign-service }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: campaign-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8081"
    spec:
      serviceAccountName: campaign-service
      securityContext:
        runAsNonRoot: true
      containers:
        - name: campaign-service
          image: ghcr.io/shubhajit93/campaign-service:0.1.0
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef: { name: platform-config }
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres.campaigns.svc:5432/campaigns
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: db-credentials, key: campaigns-username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: db-credentials, key: campaigns-password } }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 768Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            initialDelaySeconds: 40
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: campaign-service
  namespace: campaigns
spec:
  selector: { app: campaign-service }
  ports:
    - port: 80
      targetPort: 8081
