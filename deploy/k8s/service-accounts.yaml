# Each service gets its own IAM role (from deploy/terraform: <service>-sqs policy), scoped to the
# queues it actually uses. Replace the account id and role names with your Terraform outputs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: campaign-service
  namespace: campaigns
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/campaign-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: delivery-worker
  namespace: campaigns
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/delivery-worker
