# Local stack: PostgreSQL, LocalStack (SQS), and both services.
# Usage: ./gradlew bootJar && docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  # SQS emulator. The ready hook creates every queue with its DLQ and redrive policy.
  localstack:
    image: localstack/localstack:3.8.1
    ports: ["4566:4566"]
    environment:
      SERVICES: sqs
    volumes:
      - ./docker/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name delivery-completed > /dev/null"]
      interval: 5s
      retries: 20

  campaign-service:
    build: ./campaign-service
    ports: ["8081:8081"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/campaigns
      SPRING_CLOUD_AWS_SQS_ENDPOINT: http://localstack:4566
      SPRING_CLOUD_AWS_REGION_STATIC: us-east-1
      SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY: test
      SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY: test
    depends_on:
      postgres: { condition: service_healthy }
      localstack: { condition: service_healthy }

  delivery-worker:
    build: ./delivery-worker
    ports: ["8082:8082"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/deliveries
      SPRING_CLOUD_AWS_SQS_ENDPOINT: http://localstack:4566
      SPRING_CLOUD_AWS_REGION_STATIC: us-east-1
      SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY: test
      SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY: test
      # Make 20% of sends fail transiently to watch retries and the dead-letter queue at work.
      SIMULATED_FAILURE_RATE: "0.2"
    depends_on:
      postgres: { condition: service_healthy }
      localstack: { condition: service_healthy }
