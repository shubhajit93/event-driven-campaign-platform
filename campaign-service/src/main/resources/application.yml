server:
  port: 8081

spring:
  application:
    name: campaign-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campaigns}
    username: ${DB_USERNAME:campaigns}
    password: ${DB_PASSWORD:campaigns}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  cloud:
    aws:
      # Credentials come from the default AWS chain (IRSA on EKS).
      # Locally, docker-compose points the SQS endpoint at LocalStack.
      region:
        static: ${AWS_REGION:ap-southeast-1}
      sqs:
        # Fail fast instead of auto-creating a queue that would have no dead-letter queue.
        queue-not-found-strategy: fail
  threads:
    virtual:
      enabled: true

outbox:
  relay:
    batch-size: 200
    interval-ms: 500
    send-timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
